<!doctype html>
<html><head><meta charset="utf-8"><title>E se sobrasse só UM — Ep.8</title>
<style>@font-face{font-family:'Oswald';src:url('fonts/Oswald.ttf')}@font-face{font-family:'Caveat';src:url('fonts/Caveat.ttf')}@font-face{font-family:'Anton';src:url('fonts/Anton.ttf')}html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// "E se sobrasse só UM?" — Ep.1. render(t) desenha o quadro do segundo t (0..60).
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TOTAL=60;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lg(y0,y1,stops){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

// ---------- PERSONAGEM ----------
const P={skin:'#e8b48c',skinS:'#c98f6b',hair:'#2b1d16',hood:'#e2683c',hoodS:'#b44c28',pants:'#2f4a73',pantsS:'#22385a',shoe:'#f2efe9',sole:'#3a3a44'};
const OUT='#1c1422';
P.hood='#ee6a35';P.hoodS='#c24e22';P.hoodL='#ff9a62';P.pants='#33507c';P.pantsS='#25395c';P.skin='#eab38a';P.skinS='#cf9167';P.hair='#2a1b14';P.hairL='#4a3226';
function seg2(x1,y1,x2,y2,w,col){ctx.lineCap='round';ctx.strokeStyle=OUT;ctx.lineWidth=w+9;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function limb(x,y,l1,l2,a1,a2,w,col,f,endFn){
  const kx=x+Math.sin(a1)*l1*f,ky=y+Math.cos(a1)*l1;
  const ex=kx+Math.sin(a1+a2)*l2*f,ey=ky+Math.cos(a1+a2)*l2;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=OUT;
  ctx.lineWidth=w+9;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(kx,ky);ctx.stroke();ctx.lineWidth=w*.88+9;ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(kx,ky);ctx.stroke();ctx.lineWidth=w*.88;ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=w*.2;ctx.beginPath();ctx.moveTo(x+4*f,y+4);ctx.lineTo(kx+4*f,ky);ctx.lineTo(ex+3*f,ey-6);ctx.stroke();
  if(endFn)endFn(ex,ey,a1+a2);
  return[ex,ey];
}
function shoeAt(ex,ey,f,dark){ctx.save();ctx.translate(ex,ey);ctx.scale(f,1);
  ctx.fillStyle=dark?'#d9d5ce':'#f6f3ee';ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,-14);ctx.quadraticCurveTo(-18,10,-14,12);ctx.lineTo(40,12);ctx.quadraticCurveTo(46,0,30,-6);ctx.quadraticCurveTo(14,-10,8,-18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#3a3a48';ctx.fillRect(-15,8,56,6);ctx.strokeStyle='#e04a2a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(4,-4);ctx.lineTo(24,-4);ctx.stroke();ctx.restore()}
function handAt(ex,ey,col){ctx.fillStyle=col;ctx.strokeStyle=OUT;ctx.lineWidth=4.5;ctx.beginPath();ctx.ellipse(ex,ey+2,10,12,0,0,7);ctx.fill();ctx.stroke()}
// pose: {f, walk(fase)|null, lean, legs, arms, look, blink, eye, brow, mouth, mouthO, hide:{legs}, holding}
const PY_WALK=1235,PS_WALK=.82;
function person(x,y,s,pose){
  const f=pose.f||1;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  let legs=pose.legs,arms=pose.arms,bob=0,sway=0;
  if(pose.walk!=null){const p=pose.walk;
    const L=ph=>[0.46*Math.sin(ph),-1.0*Math.pow(Math.max(0,Math.cos(ph)),1.4)-0.08];
    legs=[L(p+Math.PI),L(p)];
    arms=[[-0.42*Math.sin(p+Math.PI),-0.15-.35*Math.max(0,-Math.sin(p+Math.PI))],[-0.42*Math.sin(p),-0.15-.35*Math.max(0,-Math.sin(p))]];
    bob=-6*Math.abs(Math.cos(p));sway=Math.sin(p*2)*.03;}
  legs=legs||[[0.05,-0.05],[-0.05,-0.05]];arms=arms||[[0.08,-0.15],[-0.05,-0.15]];
  if(!pose.noShadow){ctx.save();ctx.translate(0,(pose.groundY??140));const g=ctx.createRadialGradient(0,0,5,0,0,95);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,95,18,0,0,7);ctx.fill();ctx.restore();}
  ctx.translate(0,bob);
  const lean=(pose.lean||0)+sway;
  if(!(pose.hide&&pose.hide.legs)) limb(-6*f,0,66,62,legs[0][0],legs[0][1],29,P.pantsS,f,(ex,ey)=>shoeAt(ex,ey+4,f,true));
  const sh=[Math.sin(lean)*116*f,-Math.cos(lean)*116];
  limb(sh[0]-4*f,sh[1]+12,52,48,arms[0][0],arms[0][1],19,P.hoodS,f,(ex,ey)=>handAt(ex,ey,P.skinS));
  // tronco
  ctx.save();ctx.rotate(lean*f);
  const tp=()=>{ctx.beginPath();ctx.moveTo(-26,-124);ctx.bezierCurveTo(-46,-112,-44,-40,-34,4);ctx.quadraticCurveTo(2,12,36,4);ctx.bezierCurveTo(44,-30,46,-104,26,-124);ctx.quadraticCurveTo(0,-132,-26,-124);ctx.closePath()};
  tp();ctx.fillStyle=P.hood;ctx.fill();ctx.save();ctx.clip();{const g=ctx.createLinearGradient(-40*f,0,10*f,0);g.addColorStop(0,P.hoodS);g.addColorStop(1,'rgba(194,78,34,0)');ctx.fillStyle=g;ctx.fillRect(-60,-140,120,160);}
  ctx.fillStyle=P.hoodL;ctx.fillRect(f>0?20:-28,-118,8,100);
  ctx.fillStyle=P.hoodS;ctx.fillRect(-50,-14,100,20);
  ctx.strokeStyle=P.hoodS;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-6*f,-60);ctx.quadraticCurveTo(14*f,-66,30*f,-56);ctx.lineTo(30*f,-26);ctx.lineTo(-6*f,-26);ctx.stroke();ctx.restore();
  tp();ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.stroke();
  // capuz
  ctx.fillStyle=P.hoodS;ctx.beginPath();ctx.ellipse(-16*f,-124,24,14,-.2*f,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#f3efe6';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(14*f,-118);ctx.lineTo(16*f,-84);ctx.stroke();ctx.fillStyle='#bbb';ctx.fillRect(14*f-3,-86,6,8);
  // pescoço
  ctx.fillStyle=P.skinS;ctx.fillRect(-4*f-10,-142,24,26);ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.strokeRect(-4*f-10,-142,24,26);
  // cabeça
  ctx.save();ctx.translate(6*f,-182);ctx.rotate((pose.look||0)*f);ctx.scale(f,1);
  ctx.fillStyle=P.skin;ctx.strokeStyle=OUT;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-40,-10);ctx.quadraticCurveTo(-44,-50,0,-52);ctx.quadraticCurveTo(42,-52,44,-8);ctx.quadraticCurveTo(52,4,46,14);ctx.quadraticCurveTo(44,30,34,40);ctx.quadraticCurveTo(10,52,-14,44);ctx.quadraticCurveTo(-42,34,-40,-10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(180,100,70,.18)';ctx.beginPath();ctx.ellipse(-12,10,26,34,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(235,120,110,.3)';ctx.beginPath();ctx.ellipse(24,22,11,7,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(70,45,35,.16)';ctx.beginPath();ctx.ellipse(18,34,26,14,.2,0,7);ctx.fill();
  // orelha
  ctx.fillStyle=P.skinS;ctx.beginPath();ctx.ellipse(-8,10,7,10,.2,0,7);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(-8,10,7,10,.2,-1.6,1.6);ctx.stroke();
  // cabelo
  ctx.fillStyle=P.hair;ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-36,26);ctx.quadraticCurveTo(-54,4,-50,-24);ctx.quadraticCurveTo(-52,-40,-36,-52);ctx.quadraticCurveTo(-26,-70,-2,-62);ctx.quadraticCurveTo(14,-74,30,-58);ctx.quadraticCurveTo(52,-56,50,-30);
  ctx.quadraticCurveTo(46,-20,38,-24);ctx.quadraticCurveTo(30,-16,22,-26);ctx.quadraticCurveTo(10,-14,0,-26);ctx.quadraticCurveTo(-10,-14,-18,-24);ctx.quadraticCurveTo(-12,-8,-14,-4);ctx.quadraticCurveTo(-26,-6,-30,12);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle=P.hairL;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-28,-44);ctx.quadraticCurveTo(-6,-58,22,-48);ctx.stroke();
  // olho
  const bl=pose.blink?0.08:(pose.eye??1);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(22,-2,10,12*bl,0,0,7);ctx.fill();
  if(bl>.2){ctx.fillStyle='#5a3423';ctx.beginPath();ctx.ellipse(26,0,6.5,8*Math.min(1,bl),0,0,7);ctx.fill();ctx.fillStyle='#120c0a';ctx.beginPath();ctx.ellipse(27,0,3.5,4.5*Math.min(1,bl),0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(29,-3,2.2,0,7);ctx.fill();}
  ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(22,-2,10,12*bl,0,Math.PI*1.0,Math.PI*2.0);ctx.stroke();
  ctx.strokeStyle=P.hair;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(12,-20+(pose.brow||0));ctx.quadraticCurveTo(22,-24+(pose.brow||0),34,-19);ctx.stroke();
  // nariz e boca
  ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(44,4);ctx.quadraticCurveTo(54,14,42,18);ctx.stroke();
  if(pose.mouthO){ctx.fillStyle='#4a1c18';ctx.beginPath();ctx.ellipse(32,30,5,7*pose.mouthO,0,0,7);ctx.fill();ctx.stroke()}
  else{const m=pose.mouth||0;ctx.strokeStyle='#7a3a2c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(24,30);ctx.quadraticCurveTo(31,31+m,38,28);ctx.stroke()}
  ctx.restore();ctx.restore();
  if(!(pose.hide&&pose.hide.legs)) limb(4*f,0,66,62,legs[1][0],legs[1][1],31,P.pants,f,(ex,ey)=>shoeAt(ex,ey+4,f,false));
  const hand=limb(sh[0]+2*f,sh[1]+12,52,48,arms[1][0],arms[1][1],21,P.hood,f,(ex,ey)=>handAt(ex,ey,P.skin));
  if(pose.holding)pose.holding(hand[0],hand[1]);
  ctx.restore();
}

// ---------- AMBIENTE ----------
function sky(top,mid,bot){ctx.fillStyle=lg(0,H,[top,mid,bot]);ctx.fillRect(0,0,W,H)}
const BCACHE={};
// Prédios gerados UMA vez por seed (não mudam ao rolar). Padrão repete a cada 2400px.
function buildings(seed,base,hmin,hmax,col,winCol,winP,off,par){
  const key=seed+'|'+base+'|'+hmin+'|'+hmax+'|'+winP;
  if(!BCACHE[key]){const r=rng(seed);const L=[];let x=0;
    while(x<2400){const w=140+r()*160,h=hmin+r()*(hmax-hmin),cap=r()<.4,wins=[];
      for(let wy=base-h+30;wy<base-40;wy+=56)for(let wx=x+18;wx<x+w-30;wx+=42)wins.push([wx-x,wy,r()<winP]);
      L.push({x,w,h,cap,wins,ant:r()<.35,tank:r()<.3});x+=w+r()*24;}
    BCACHE[key]={L,span:Math.max(2400,x)};}
  const {L,span}=BCACHE[key];const o=((off*par)%span+span)%span;
  for(let rep=-1;rep<2;rep++){const ox=rep*span-o-100;
    for(const b of L){const X=b.x+ox;if(X+b.w<-60||X>W+60)continue;
      ctx.fillStyle=col;ctx.fillRect(X,base-b.h,b.w,b.h);if(b.cap)ctx.fillRect(X+b.w*.35,base-b.h-30,b.w*.3,30);
      if(b.ant){ctx.fillRect(X+b.w*.7,base-b.h-90,4,90);ctx.fillRect(X+b.w*.7-14,base-b.h-70,32,3)}
      if(b.tank){ctx.fillRect(X+b.w*.15,base-b.h-46,40,40);ctx.fillRect(X+b.w*.15+4,base-b.h-60,32,16)}
      // variação de tom por prédio + luz de cima / sombra embaixo
      const tn=((Math.sin(b.x*12.9898)*43758.5453)%1+1)%1;
      ctx.fillStyle=tn<.5?`rgba(255,255,255,${(.5-tn)*.14})`:`rgba(0,0,0,${(tn-.5)*.16})`;ctx.fillRect(X,base-b.h,b.w,b.h);
      {const g=ctx.createLinearGradient(0,base-b.h,0,base);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.22)');ctx.fillStyle=g;ctx.fillRect(X,base-b.h,b.w,b.h)}
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(X+b.w*.8,base-b.h,b.w*.2,b.h);
      // platibanda (borda do topo) com luz
      ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(X-4,base-b.h,b.w+8,12);ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(X-4,base-b.h,b.w+8,3);
      // faixas de andares
      ctx.fillStyle='rgba(0,0,0,.07)';for(let fy=base-b.h+82;fy<base-30;fy+=56)ctx.fillRect(X,fy,b.w*.8,3);
      if(winCol)for(const [wx,wy,on] of b.wins){
        if(on){ctx.fillStyle=winCol;ctx.globalAlpha=.22;ctx.fillRect(X+wx-6,wy-6,32,42);ctx.globalAlpha=1}
        ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(X+wx-2,wy-2,24,34);ctx.fillStyle=on?winCol:'rgba(255,255,255,.06)';ctx.fillRect(X+wx,wy,20,30);
        if(on){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(X+wx+2,wy+2,6,12)}else{ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(X+wx,wy,7,30)}
        ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(X+wx+9,wy,2,30);ctx.fillRect(X+wx,wy+14,20,2)}}}
}
function sun(x,y,r,col,glow){const g=ctx.createRadialGradient(x,y,r*.2,x,y,r*4);g.addColorStop(0,glow);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function car(x,y,col,f=1,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,6,190,16,0,0,7);ctx.fill();
  ctx.fillStyle=col;rr(-180,-90,360,80,26);ctx.fill();
  ctx.beginPath();ctx.moveTo(-100,-88);ctx.quadraticCurveTo(-70,-160,10,-160);ctx.lineTo(70,-160);ctx.quadraticCurveTo(110,-150,130,-88);ctx.fill();
  ctx.fillStyle='#bcd3e6';ctx.beginPath();ctx.moveTo(-76,-92);ctx.quadraticCurveTo(-54,-142,6,-142);ctx.lineTo(6,-92);ctx.fill();
  ctx.beginPath();ctx.moveTo(22,-92);ctx.lineTo(22,-142);ctx.lineTo(66,-142);ctx.quadraticCurveTo(96,-134,110,-92);ctx.fill();
  ctx.fillStyle='#ffe9a8';rr(150,-70,26,18,6);ctx.fill();ctx.fillStyle='#c33';rr(-180,-70,16,18,4);ctx.fill();
  for(const wx of[-110,110]){ctx.fillStyle='#1d1d22';ctx.beginPath();ctx.arc(wx,-8,36,0,7);ctx.fill();ctx.fillStyle='#8a8a96';ctx.beginPath();ctx.arc(wx,-8,15,0,7);ctx.fill()}
  ctx.restore()}
function carFront(x,y,col,s){ // carro visto de frente; (x,y)=chão no centro
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=OUT;ctx.lineWidth=6;ctx.lineJoin='round';
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,4,190,22,0,0,7);ctx.fill();
  // pneus
  ctx.fillStyle='#1d1d22';rr(-165,-60,56,66,12);ctx.fill();ctx.stroke();rr(109,-60,56,66,12);ctx.fill();ctx.stroke();
  // cabine (teto e para-brisa)
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-118,-150);ctx.lineTo(-92,-232);ctx.quadraticCurveTo(0,-246,92,-232);ctx.lineTo(118,-150);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#bfe3f5';ctx.beginPath();ctx.moveTo(-104,-156);ctx.lineTo(-83,-220);ctx.quadraticCurveTo(0,-232,83,-220);ctx.lineTo(104,-156);ctx.closePath();ctx.fill();ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(-60,-162);ctx.lineTo(-30,-214);ctx.lineTo(-10,-214);ctx.lineTo(-40,-162);ctx.closePath();ctx.fill();
  // retrovisores
  ctx.lineWidth=5;ctx.fillStyle=col;rr(-150,-168,34,22,8);ctx.fill();ctx.stroke();rr(116,-168,34,22,8);ctx.fill();ctx.stroke();
  // corpo
  ctx.lineWidth=6;ctx.fillStyle=col;rr(-178,-158,356,118,30);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.18)';rr(-160,-150,320,16,8);ctx.fill();
  // faróis
  for(const sx of [-1,1]){ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.ellipse(sx*122,-112,34,20,0,0,7);ctx.fill();ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(sx*122,-112,9,0,7);ctx.fill()}
  // grade e placa
  ctx.fillStyle='#2a2b31';rr(-66,-128,132,36,12);ctx.fill();ctx.stroke();ctx.strokeStyle='#4a4b55';ctx.lineWidth=3;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-56,-110+i*9);ctx.lineTo(56,-110+i*9);ctx.stroke()}
  ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.fillStyle='#3a3b44';rr(-182,-62,364,30,12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#f2f2f2';rr(-46,-80,92,30,5);ctx.fill();ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#2c4f9e';ctx.fillRect(-46,-80,92,7);
  ctx.restore()}
function trafficLight(x,y,on){ctx.save();ctx.strokeStyle=OUT;ctx.lineWidth=5;
  ctx.fillStyle='#2f3038';ctx.fillRect(x-9,y,18,420);ctx.strokeRect(x-9,y,18,420);ctx.fillRect(x-22,y+404,44,16);ctx.strokeRect(x-22,y+404,44,16);
  ctx.fillStyle='#262730';rr(x-38,y-180,76,196,16);ctx.fill();ctx.stroke();
  const cols=['#4a1a1a','#4a4216','#173f22'];cols.forEach((c,i)=>{const cy=y-140+i*58;ctx.fillStyle='#15161c';ctx.beginPath();ctx.arc(x,cy-4,27,Math.PI,0);ctx.fill();ctx.fillStyle=(on&&i==1)?'#ffc533':c;ctx.beginPath();ctx.arc(x,cy,20,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke()});
  if(on){const g=ctx.createRadialGradient(x,y-82,5,x,y-82,120);g.addColorStop(0,'rgba(255,197,51,.45)');g.addColorStop(1,'rgba(255,197,51,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y-82,120,0,7);ctx.fill()}
  ctx.restore()}
function envelope(x,y,s,rot=0,open=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.25)';rr(-86,-46,180,104,8);ctx.fill();
  ctx.fillStyle='#f6efdc';rr(-90,-52,180,104,8);ctx.fill();
  ctx.strokeStyle='#d6cbb0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-90,-52);ctx.lineTo(0,10-open*80);ctx.lineTo(90,-52);ctx.stroke();
  ctx.fillStyle='#b8312f';ctx.beginPath();ctx.arc(0,4-open*70,15,0,7);ctx.fill();ctx.restore()}
function birds(t,x0,y0,n,seed){const r=rng(seed);ctx.strokeStyle='rgba(30,30,40,.7)';ctx.lineWidth=4;

// ---- o desenho da criança (giz de cera): os três de mãos dadas na frente de uma porta "60" ----
// reveal 0..1: quanto já foi desenhado; label: mostra os nomes
function e8Drawing(cx,cy,s,reveal,label){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  const w=760,h=900;ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-w/2+8,-h/2+10,w,h);
  ctx.fillStyle='#f3ecda';ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='#d8cfb8';ctx.lineWidth=5;ctx.strokeRect(-w/2,-h/2,w,h);
  ctx.save();ctx.beginPath();ctx.rect(-w/2,-h/2,w,h);ctx.clip();
  ctx.lineCap='round';ctx.lineJoin='round';
  // céu rabiscado (azul) no topo + sol
  if(reveal>0.1){ctx.strokeStyle='#4f7fd0';ctx.lineWidth=12;ctx.globalAlpha=Math.min(1,reveal*4);
    for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-320+i*14,-380);ctx.lineTo(320,-372+i*12);ctx.stroke();}
    ctx.strokeStyle='#e8a81e';ctx.lineWidth=12;ctx.beginPath();ctx.arc(250,-330,54,0,7);ctx.stroke();for(let a=0;a<7;a++){ctx.beginPath();ctx.moveTo(250+Math.cos(a)*64,-330+Math.sin(a)*64);ctx.lineTo(250+Math.cos(a)*92,-330+Math.sin(a)*92);ctx.stroke();}ctx.globalAlpha=1;}
  // a porta com "60"
  if(reveal>0.3){const dk=Math.min(1,(reveal-0.3)*3);ctx.globalAlpha=dk;ctx.strokeStyle='#8a5a2e';ctx.lineWidth=14;ctx.strokeRect(-120,-250,240,470);
    ctx.fillStyle='#caa05a';ctx.globalAlpha=dk*0.5;ctx.fillRect(-120,-250,240,470);ctx.globalAlpha=dk;
    ctx.fillStyle='#c0392b';ctx.font='900 150px Caveat';ctx.textAlign='center';ctx.fillText('60',0,-20);
    ctx.fillStyle='#e8a81e';ctx.beginPath();ctx.arc(86,20,14,0,7);ctx.fill();ctx.textAlign='left';ctx.globalAlpha=1;}
  // os três bonequinhos de mãos dadas, na frente da porta
  if(reveal>0.5){const pk=Math.min(1,(reveal-0.5)*2.5);ctx.globalAlpha=pk;
    const fig=(fx,fy,fs,col,head,extra)=>{ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=13;
      ctx.beginPath();ctx.arc(fx,fy-fs*62,fs*40,0,7);ctx[head?'fill':'stroke']();
      ctx.beginPath();ctx.moveTo(fx,fy-fs*22);ctx.lineTo(fx,fy+fs*54);ctx.stroke();
      ctx.beginPath();ctx.moveTo(fx-fs*42,fy+fs*96);ctx.lineTo(fx,fy+fs*54);ctx.lineTo(fx+fs*42,fy+fs*96);ctx.stroke();
      extra&&extra(fx,fy,fs);};
    // criança (amarela, pequena, à esquerda)
    fig(-250,300,0.95,'#e8a81e',true,(fx,fy,fs)=>{ctx.strokeStyle='#e8a81e';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(fx-fs*34,fy+fs*6);ctx.lineTo(fx+fs*70,fy-fs*8);ctx.stroke();});
    // Matheus (laranja, no meio)
    fig(0,250,1.25,'#e2742a',true,(fx,fy,fs)=>{ctx.strokeStyle='#e2742a';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(fx-fs*58,fy-fs*4);ctx.lineTo(fx+fs*58,fy-fs*4);ctx.stroke();});
    // o moço da câmera (azul, mais alto, com uma câmera = quadradinho no rosto)
    fig(250,235,1.35,'#3a6fae',false,(fx,fy,fs)=>{ctx.fillStyle='#3a6fae';ctx.fillRect(fx-fs*30,fy-fs*78,fs*60,fs*40);ctx.strokeStyle='#3a6fae';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(fx-fs*60,fy-fs*2);ctx.lineTo(fx+fs*34,fy+fs*6);ctx.stroke();});
    ctx.globalAlpha=1;
    if(label){ctx.fillStyle='#2f2a22';ctx.font='700 46px Caveat';ctx.textAlign='center';
      ctx.fillText('eu',-250,470);ctx.fillText('você',0,470);ctx.fillText('o moço da câmera',250,470);ctx.textAlign='left';}
  }
  ctx.restore();ctx.restore();}
