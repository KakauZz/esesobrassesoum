name: amostras-voz
on:
  workflow_dispatch:
    inputs:
      vozes:
        description: "Vozes do Gemini separadas por espaço"
        required: true
permissions:
  contents: write
jobs:
  amostras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: python3 amostras_voz.py ${{ inputs.vozes }}
      - run: |
          git config user.name "amostras"; git config user.email "actions@github.com"
          git add -f amostras/*.wav && git commit -m "amostras de voz" && git pull --rebase && git push
