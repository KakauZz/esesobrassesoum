name: gerar-voz
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do episódio (ex: ep04/animado)"
        required: true
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Gerar voz (Gemini, Zubenelgenubi)
        env:
          KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          i=1; for k in $KEYS; do echo "GEMINI_API_KEY_$i=$k" >> chaves_api.txt; i=$((i+1)); done
          python3 gerar_voz.py "${{ inputs.pasta }}"
          rm chaves_api.txt
      - name: Salvar a voz no repositório
        run: |
          git config user.name "gerar-voz"; git config user.email "actions@github.com"
          git add -f "${{ inputs.pasta }}/saida/voz_full.wav"
          git commit -m "voz: ${{ inputs.pasta }}" && git push
