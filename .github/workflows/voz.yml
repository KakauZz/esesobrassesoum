name: gerar-voz
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do episódio (ex: ep04/animado)"
        required: true
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Gerar voz (Gemini, Zubenelgenubi)
        env:
          K1: ${{ secrets.GEMINI_API_KEY_1 }}
          K2: ${{ secrets.GEMINI_API_KEY_2 }}
          K3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          printf "GEMINI_API_KEY_1=%s\nGEMINI_API_KEY_2=%s\nGEMINI_API_KEY_3=%s\n" "$K1" "$K2" "$K3" > chaves_api.txt
          python3 gerar_voz.py "${{ inputs.pasta }}"
          rm chaves_api.txt
      - name: Salvar a voz no repositório
        run: |
          git config user.name "gerar-voz"; git config user.email "actions@github.com"
          git add -f "${{ inputs.pasta }}/saida/voz_full.wav"
          git commit -m "voz: ${{ inputs.pasta }}" && git push
